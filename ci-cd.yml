name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (noop)
        run: echo "No dependencies"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Deploy (demo)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploy to staging (demo)"
          echo "BuildMarket deployed успешно"
